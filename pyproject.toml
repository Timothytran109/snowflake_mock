[tool.ruff]
# General Ruff settings
line-length = 88
target-version = "py312"

# Ignore generated and environment files
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "mlruns",
    "mlartifacts",
]

[tool.ruff.lint]
# Enabled rule groups
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

# Let formatter handle line length
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.sqlfluff.core]
# Snowflake SQL syntax
dialect = "snowflake"
