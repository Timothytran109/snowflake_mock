      email: alice@example.com
      event_type: email_open
      device_type: mobile
      campaign_id: cmp_1
      event_timestamp: '2026-02-02 09:10:00'
      _line: 1
    - event_id: evt_2
      email: b@example.com
      event_type: page_view
      device_type: desktop
      campaign_id: cmp_1
      event_timestamp: '2026-02-03 13:45:00'
      _line: 5
    - event_id: evt_3
      email: c@example.com
      event_type: form_submit
      device_type: tablet
      campaign_id: cmp_2
      event_timestamp: '2026-02-04 16:20:00'
      _line: 3
    - event_id: evt_4
      email: d@example.com
      event_type: click
      device_type: mobile
      campaign_id: cmp_2
      event_timestamp: '2026-02-07 00:00:00'
      _line: 4
