- name: adobe_events_normalize_types_and_mixed_timestamps
  model: stg_adobe__events
  given:
  - input: source('raw', 'mock_adobe_events')
    rows:
    - _line: 1
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      event_id: ' evt_1 '
      email: ' Alice@Example.COM '
      event_type: ' Email Open '
      device_type: ' MOBILE '
      campaign_id: ' cmp_1 '
      event_timestamp: 02/02/2026 09:10
    - _line: 2
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      event_id: evt_2
      email: b@example.com
      event_type: page view
      device_type: Desktop
      campaign_id: cmp_1
      event_timestamp: 2026/02/03 13:45:00
    - _line: 3
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      event_id: evt_3
      email: c@example.com
      event_type: form_submit
      device_type: tablet
      campaign_id: cmp_2
      event_timestamp: '2026-02-04 16:20:00'
    - _line: 4
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      event_id: evt_4
      email: d@example.com
      event_type: CLICK
      device_type: mobile
      campaign_id: cmp_2
      event_timestamp: '2026-02-07'
    - _line: 5
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      event_id: evt_2
      email: b@example.com
      event_type: page_view
      device_type: Desktop
      campaign_id: cmp_1
      event_timestamp: 2026/02/03 13:45:00
