      email: shared@example.com
      company_name: Alpha
      industry: Tech
      created_at: '2026-01-05 00:00:00'
      updated_at: '2026-02-20 09:30:00.123'
      _line: 1
    - account_id: acct_2
      email: shared@example.com
      company_name: Beta
      industry: Finance
      created_at: '2026-01-12 00:00:00'
      updated_at: '2026-02-18 14:05:00'
      _line: 2
