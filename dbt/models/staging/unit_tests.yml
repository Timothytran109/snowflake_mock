# Synthetic fixtures exercise transformations independently of current RAW contents.
version: 2
unit_tests:
- name: stripe_customers_clean_dates_and_choose_latest
  model: stg_stripe__customers
  given:
  - input: source('raw', 'mock_stripe_customers')
    rows:
    - _line: 1
      _fivetran_synced: '2026-02-28 00:00:00 +00:00'
      customer_id: ' cus_1 '
      email: ' OLD@EXAMPLE.COM '
      created_at: '2026-01-06'
    - _line: 2
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_1
      email: loser@example.com
      created_at: 01/09/2026
    - _line: 3
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_1
      email: ' Alice@Example.COM '
      created_at: 01/09/2026
    - _line: 4
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_2
      email: ' '
      created_at: 2026/01/21
    - _line: 5
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_3
      email: null
      created_at: '2026-02-02'
  expect:
    rows:
    - customer_id: cus_1
      email: alice@example.com
      created_at: '2026-01-09 00:00:00'
      _line: 3
    - customer_id: cus_2
      email: null
      created_at: '2026-01-21 00:00:00'
      _line: 4
    - customer_id: cus_3
      email: null
      created_at: '2026-02-02 00:00:00'
      _line: 5
- name: stripe_subscriptions_normalize_and_preserve_open_ends
  model: stg_stripe__subscriptions
  given:
  - input: source('raw', 'mock_stripe_subscriptions')
    rows:
    - _line: 1
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      subscription_id: ' sub_1 '
      customer_id: ' cus_1 '
      plan: ' Pro '
      status: ' ACTIVE '
      start_date: 01/10/2026
      end_date: null
    - _line: 2
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      subscription_id: sub_2
      customer_id: cus_2
      plan: Basic
      status: canceled
      start_date: 2026/01/22
      end_date: '2026-02-20'
    - _line: 3
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      subscription_id: sub_2
      customer_id: cus_2
      plan: ' Enterprise '
      status: ' PAST_DUE '
      start_date: 2026/01/22
      end_date: '2026-02-20'
    - _line: 4
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      subscription_id: sub_3
      customer_id: cus_3
      plan: Basic
      status: trialing
      start_date: '2026-02-03'
      end_date: null
  expect:
    rows:
    - subscription_id: sub_1
      customer_id: cus_1
      plan: pro
      status: active
      start_date: '2026-01-10'
      end_date: null
      _line: 1
    - subscription_id: sub_2
      customer_id: cus_2
      plan: enterprise
      status: past_due
      start_date: '2026-01-22'
      end_date: '2026-02-20'
      _line: 3
    - subscription_id: sub_3
      customer_id: cus_3
      plan: basic
      status: trialing
      start_date: '2026-02-03'
      end_date: null
      _line: 4
- name: salesforce_accounts_keep_shared_emails_and_latest_update
  model: stg_salesforce__accounts
