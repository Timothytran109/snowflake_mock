- name: stripe_customers_clean_dates_and_choose_latest
  model: stg_stripe__customers
  given:
  - input: source('raw', 'mock_stripe_customers')
    rows:
    - _line: 1
      _fivetran_synced: '2026-02-28 00:00:00 +00:00'
      customer_id: ' cus_1 '
      email: ' OLD@EXAMPLE.COM '
      created_at: '2026-01-06'
    - _line: 2
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_1
      email: loser@example.com
      created_at: 01/09/2026
    - _line: 3
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_1
      email: ' Alice@Example.COM '
      created_at: 01/09/2026
    - _line: 4
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_2
      email: ' '
      created_at: 2026/01/21
    - _line: 5
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      customer_id: cus_3
      email: null
      created_at: '2026-02-02'
  expect:
    rows:
    - customer_id: cus_1
      email: alice@example.com
      created_at: '2026-01-09 00:00:00'
      _line: 3
    - customer_id: cus_2
      email: null
      created_at: '2026-01-21 00:00:00'
      _line: 4
    - customer_id: cus_3
      email: null
      created_at: '2026-02-02 00:00:00'
      _line: 5
