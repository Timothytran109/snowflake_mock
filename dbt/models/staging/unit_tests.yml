      company_name: ' Alpha '
      industry: ' Tech '
      created_at: '2026-01-05'
      updated_at: '2026-02-20 09:30:00.123'
    - _line: 2
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      account_id: acct_2
      email: shared@example.com
      company_name: ' Beta '
      industry: ' Finance '
      created_at: 2026/01/12
      updated_at: '2026-02-18 14:05:00'
    - _line: 3
      _fivetran_synced: '2026-03-01 00:00:00 +00:00'
      account_id: acct_1
      email: stale@example.com
      company_name: Stale
      industry: Tech
