    # Each pair differs in just one content field: later ordering keys cannot mask an omission.
    rows:
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_customer, customer_id: cus_Z, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_customer, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_email, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_email, customer_id: cus_a, email: z@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_subscription, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_subscription, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_z, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_amount, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '9', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_amount, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_currency, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: EUR, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_currency, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_status, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: failed}
    - {_line: 42, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_status, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: succeeded}
    - {_line: null, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
       payment_id: pay_null_line, customer_id: cus_a, email: a@example.invalid, subscription_id: sub_a, amount: '10', currency: USD, status: succeeded}
    - {_line: null, _fivetran_synced: '2026-03-02 00:00:00 +00:00', payment_timestamp: '2026-02-28 12:00:00 +00:00',
